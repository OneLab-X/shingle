name: Feature request
description: An idea for the workflow, template, design directions or scripts
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like Shingle to do?
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Interview, Design directions or palettes, Template, SEO, Scripts, Deploy, Docs, Other]
